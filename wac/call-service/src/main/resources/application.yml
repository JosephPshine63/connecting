server:
  port: 8085

spring:
  banner:
    location: classpath:banner/banner.txt
  application:
    name: call-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_CALL_USER:${RABBITMQ_USER:wacchat}}
    password: ${RABBITMQ_CALL_PASSWORD:${RABBITMQ_PASSWORD:wacchat}}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/wacchat}
          audiences:
            - wacchat-app

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

application:
  call:
    exchange: wacchat.calls
    routing-key: call
    queue: wacchat.calls.queue
    ring-timeout-seconds: ${CALL_RING_TIMEOUT_SECONDS:45}
  backend:
    base-url: ${BACKEND_BASE_URL:http://localhost:8082}
    internal-api-key: ${BACKEND_INTERNAL_API_KEY:}
    connect-timeout-ms: 2000
    response-timeout-ms: 5000

resilience4j:
  circuitbreaker:
    instances:
      chatValidation:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      chatValidation:
        maxAttempts: 2
        waitDuration: 300ms
