<div class="message-actions-menu">
  <button #toggleBtn class="message-actions-btn" [class.menu-open]="open" (click)="onToggleClick($event)" title="Azioni">
    <i class="fa-solid fa-ellipsis-vertical"></i>
  </button>
  @if (open) {
    <div class="message-actions-dropdown" [class.opens-up]="opensUpward" (click)="$event.stopPropagation()">
      <button type="button" (click)="onReact($event)">
        <i class="fa-regular fa-face-smile"></i> Reagisci
      </button>
      <button type="button" (click)="onReply($event)">
        <i class="fa-solid fa-reply"></i> Rispondi
      </button>
      @if (canEdit) {
        <button type="button" (click)="onEdit($event)">
          <i class="fa-solid fa-pen"></i> Modifica
        </button>
      }
      @if (canDelete) {
        <button type="button" class="danger" (click)="onDelete($event)">
          <i class="fa-solid fa-trash"></i> Elimina
        </button>
      }
      @if (canForward) {
        <button type="button" (click)="onForward($event)">
          <i class="fa-solid fa-share"></i> Inoltra
        </button>
      }
      @if (canCopy) {
        <button type="button" (click)="onCopy($event)">
          <i class="fa-solid fa-copy"></i> Copia
        </button>
      }
    </div>
  }
</div>
